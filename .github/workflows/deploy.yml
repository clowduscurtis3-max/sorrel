name: Deploy

# Runs only after CI has genuinely passed on main - never deploys code that
# hasn't been tested/linted/formatted. See ci.yml for what "success" means.
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]

permissions:
  id-token: write # required for OIDC - no stored AWS credentials anywhere
  contents: read

jobs:
  deploy:
    name: Deploy backend to production
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: DEBUG - print OIDC subject claim
        run: |
          TOKEN=$(curl -sSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "$TOKEN" | cut -d. -f2 | base64 -d 2>/dev/null | jq '{sub, aud, ref, event_name, workflow_ref}'

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::860803563132:role/sorrel-github-deploy-role
          aws-region: us-east-1

      - name: Package server
        run: |
          cd server
          zip -r ../server.zip . -x "node_modules/*" -x ".env" -x "*.log"

      - name: Upload deploy artifact
        run: aws s3 cp server.zip s3://sorrel-deploy-860803563132/server.zip

      - name: Run deploy on instance (via SSM, no SSH)
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=sorrel-backend" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" --output text)

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" == "None" ]; then
            echo "No running instance tagged sorrel-backend found."
            exit 1
          fi
          echo "Deploying to $INSTANCE_ID"

          jq -n --rawfile script infra/deploy.sh '{commands: [$script]}' > /tmp/deploy-params.json

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/deploy-params.json \
            --query "Command.CommandId" --output text)
          echo "Command: $COMMAND_ID"

          STATUS="Pending"
          for _ in $(seq 1 40); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            if [ "$STATUS" != "InProgress" ] && [ "$STATUS" != "Pending" ]; then
              break
            fi
            sleep 5
          done

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}" \
            --output text

          if [ "$STATUS" != "Success" ]; then
            echo "Deploy failed (status: $STATUS)"
            exit 1
          fi
