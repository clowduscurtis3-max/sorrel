name: Deploy

# Runs only after CI has genuinely passed on main - never deploys code that
# hasn't been tested/linted/formatted. See ci.yml for what "success" means.
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]

permissions:
  id-token: write # required for OIDC - no stored AWS credentials anywhere
  contents: read

jobs:
  deploy:
    name: Deploy backend to production
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::860803563132:role/sorrel-github-deploy-role
          aws-region: us-east-1

      - name: Package server
        run: |
          cd server
          zip -r ../server.zip . -x "node_modules/*" -x ".env" -x "*.log"

      - name: Upload server deploy artifact
        run: aws s3 cp server.zip s3://sorrel-deploy-860803563132/server.zip

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Export web build
        working-directory: app
        env:
          # Same values as app/eas.json's own "production" build profile -
          # not secrets: EXPO_PUBLIC_* vars are baked into the client bundle
          # either way, and the Supabase key is its public anon/publishable
          # key, not a service-role credential.
          EXPO_PUBLIC_SUPABASE_URL: https://xaennhhmvtjkxtnwoqdm.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_IFNBqOPt2jUGlJFW_KgbrQ_cCy4XSas
          EXPO_PUBLIC_API_URL: https://api.sorrel-app.com
        run: npx expo export --platform web --output-dir dist

      - name: Package web build
        run: |
          cd app/dist
          zip -r ../../web.zip .

      - name: Upload web deploy artifact
        run: aws s3 cp web.zip s3://sorrel-deploy-860803563132/web.zip

      - name: Run deploy on instance (via SSM, no SSH)
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=sorrel-backend" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" --output text)

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" == "None" ]; then
            echo "No running instance tagged sorrel-backend found."
            exit 1
          fi
          echo "Deploying to $INSTANCE_ID"

          jq -n --rawfile script infra/deploy.sh '{commands: [$script]}' > /tmp/deploy-params.json

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/deploy-params.json \
            --query "Command.CommandId" --output text)
          echo "Command: $COMMAND_ID"

          STATUS="Pending"
          for _ in $(seq 1 40); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            if [ "$STATUS" != "InProgress" ] && [ "$STATUS" != "Pending" ]; then
              break
            fi
            sleep 5
          done

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}" \
            --output text

          if [ "$STATUS" != "Success" ]; then
            echo "Deploy failed (status: $STATUS)"
            exit 1
          fi
